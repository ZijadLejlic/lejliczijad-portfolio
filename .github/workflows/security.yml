# Security checks on every PR, every push to main and weekly (tech.md §16–17, P1.ENV.11).
#
# - `audit`: `pnpm audit` fails on high/critical advisories (AGENTS.md §11).
# - `gitleaks`: scans the full git history for committed secrets. The CLI (MIT) is downloaded from
#   the official release and checked against its published SHA-256, instead of gitleaks-action,
#   which needs a license key for some accounts.
# - `codeql`: JS/TS static analysis. Code scanning on a private repo needs GitHub Code Security
#   (Team/Enterprise), so the job only runs when the repo variable CODEQL_ENABLED is 'true'.
#   Turn it on once the repo is public or licensed: Settings → Secrets and variables → Actions →
#   Variables → CODEQL_ENABLED = true.
#
# The weekly run catches new advisories against an unchanged lockfile. Actions are pinned to a full
# commit SHA (tag in the comment), like ci.yml.

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 05:23 UTC (off the hour to avoid the scheduler rush).
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # From gitleaks_8.30.1_checksums.txt in the v8.30.1 release. Update together with the version.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Reads pnpm-lock.yaml only; no install needed. Moderate and low advisories are listed in
      # the log but do not fail the job.
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps any secret it finds out of the public log.
      - name: Scan git history
        run: gitleaks git --redact --no-banner --verbose .

  codeql:
    name: CodeQL (JS/TS)
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:javascript-typescript
