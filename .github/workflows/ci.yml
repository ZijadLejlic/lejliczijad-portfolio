# CI for every PR and every push to main (tech.md §17, P1.ENV.10).
#
# Two jobs: `checks` (lint → typecheck → unit → api → build) and `e2e` (Playwright), which only runs
# once checks pass. Until the PR preview deploy exists (P1.ENV.14), e2e runs against a local
# `astro preview` of the same build that the Playwright webServer starts; after that, CI sets
# PLAYWRIGHT_BASE_URL to the preview URL and the local server is skipped.
#
# Third-party actions are pinned to a full commit SHA (tag in the comment), so a moved or
# compromised tag cannot change what runs here. Dependabot (P1.ENV.12) bumps them.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # astro:env requires these at build time (tech.md §9.7). Not secrets. `preview` keeps noindex on
  # and analytics off, so a CI build can never pass for a production one.
  PUBLIC_SITE_URL: https://lejliczijad.com
  PUBLIC_DEPLOY_ENV: preview

jobs:
  checks:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the exact pnpm version from package.json `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Stylelint)
        run: pnpm lint:css

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: API tests (workerd)
        run: pnpm test:api

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser binaries are cached per Playwright version; system libraries are not cacheable,
      # so on a cache hit only the OS dependencies are installed.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm test:e2e:install

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
